<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Maplibre GL -->
<link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>

<!-- Maplibre GL Leaflet  -->
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

<div id="map" style="width: 100%; height: 500px"></div>

<div id="gigs">
<div>

<script src="data.js"></script>
<script>
  const map = L.map('map').setView([42.429752, -71.071022], 14)

  L.maplibreGL({
    style: 'https://tiles.openfreemap.org/styles/liberty',
  }).addTo(map)

  function gigStartTime(gig) {
    // I think it will default to "today"
    const now = new Date()
    return new Date(now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate() + " " + gig.starthour + ":" + gig.startminute)
  }
  function gigEndTime(gig) {
    MS_PER_MINUTE = 60 * 1000
    return Date(gigStartTime(gig) + gig.duration * MS_PER_MINUTE)
  }

  const sortedGigIds = Object.keys(gigs).sort((a, b) => {
    return gigStartTime(gigs[a]) - gigStartTime(gigs[b]);
  });

  function resetGigs() {
    gigsText = "";
    for (const gigid of sortedGigIds) {
        // for this gig...
        const gig = gigs[gigid]
        const band = bands[gig.bandid]
        const porch = porches[gig.porchid]

        // add a new div for this gig
        gigsText = gigsText + (
            "<div>" + gig.starthour + ":" +gig.startminute + " - " + band.actname + "</div>"
        )
    }
    document.getElementById('gigs').innerHTML = gigsText
  }

  // reset gigs now, on map move, and on map zoom
  resetGigs()
  map.on('moveend', resetGigs)
  map.on('zoomend', resetGigs)

  for (porchid in porches) {
      const porch = porches[porchid]

      // Creating a marker
      var marker = new L.Marker([porch.lat, porch.lng]);

      // Adding marker to the map
      marker.addTo(map);
  }
</script>
